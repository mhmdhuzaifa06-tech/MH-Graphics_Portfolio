    <meta name="description"

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            scroll-behavior: smooth;
        }

        :root {
            --bg: #0a0a0a;
            --card: #121212;
            --card2: #181818;
            --text: #ffffff;
            --muted: #a5a5a5;
            --red: #e50914;
            --red-dark: #a80710;
            --border: rgba(255,255,255,0.10);
        }

        body.light {
            --bg: #f7f7f7;
            --card: #ffffff;
            --card2: #eeeeee;
            --text: #111111;
            --muted: #555555;
            --border: rgba(0,0,0,0.10);
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
            transition: 0.3s;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        .container {
            width: 90%;
            max-width: 1200px;
            margin: auto;
        }

        /* NAVBAR */

        nav {
            position: fixed;
            top: 0;
            width: 100%;
            z-index: 1000;
            background: rgba(10,10,10,0.90);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
        }

        .nav-container {
            min-height: 75px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo {
            font-size: 25px;
            font-weight: 900;
            letter-spacing: 1px;
        }

        .logo span {
            color: var(--red);
        }

        .nav-links {
            display: flex;
            gap: 25px;
            list-style: none;
        }

        .nav-links a {
            color: var(--muted);
            font-size: 14px;
            transition: 0.3s;
        }

        .nav-links a:hover {
            color: var(--red);
        }

        .theme-btn {
            border: 1px solid var(--border);
            background: transparent;
            color: var(--text);
            padding: 8px 12px;
            border-radius: 20px;
            cursor: pointer;
            margin-left: 20px;
        }

        /* HERO */

        .hero {
            min-height: 100vh;
            display: flex;
            align-items: center;
            padding-top: 90px;
            background:
                radial-gradient(circle at 85% 30%, rgba(229,9,20,0.18), transparent 30%),
                radial-gradient(circle at 10% 80%, rgba(229,9,20,0.08), transparent 30%);
        }

        .hero-grid {
            display: grid;
            grid-template-columns: 1.3fr 0.7fr;
            gap: 60px;
            align-items: center;
        }

        .hero small {
            color: var(--red);
            font-weight: bold;
            letter-spacing: 3px;
        }

        .hero h1 {
            font-size: clamp(50px, 8vw, 95px);
            line-height: 0.95;
            margin: 20px 0;
            font-weight: 900;
        }

        .hero h1 span {
            color: var(--red);
        }

        .hero h2 {
            font-size: 24px;
            margin-bottom: 18px;
        }

        .hero p {
            max-width: 650px;
            color: var(--muted);
            font-size: 17px;
        }

        .buttons {
            display: flex;
            gap: 15px;
            margin-top: 30px;
            flex-wrap: wrap;
        }

        .btn {
            display: inline-block;
            padding: 13px 22px;
            border-radius: 6px;
            font-weight: bold;
            transition: 0.3s;
            border: 1px solid var(--red);
        }
